apiVersion: apps/v1
kind: Deployment
metadata:
  generation: 1
  labels:
    app: mihomo
  name: mihomo
  namespace: default
spec:
  progressDeadlineSeconds: 60
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: mihomo
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mihomo
    spec:
      serviceAccountName: mihomo
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"

      hostNetwork: true
      containers:
        - name: mihomo
          image: 127.0.0.1:5000/metacubex/mihomo:latest
          imagePullPolicy: IfNotPresent

          #command: ["/mihomo", "-d", "/etc/mihomo", "-f", "/etc/mihomo/config.yaml"]
          
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "4"
              memory: "1Gi"
          ports:
            - name: "socks"
              containerPort: 1080
            - name: "http"
              containerPort: 1087
          volumeMounts:
            - name: mihomo-config
              mountPath: /root/.config/mihomo/config.yaml
              subPath: config.yaml
              readOnly: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      volumes:
        - name: mihomo-config
          configMap:
            name: mihomo-config
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
#     securityContext:
#       runAsUser: 1000
#       runAsGroup: 1000
#       fsGroup: 1000
      terminationGracePeriodSeconds: 30
